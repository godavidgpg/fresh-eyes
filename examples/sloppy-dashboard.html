<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue AI</title>
<!-- Deliberately flawed screen for trying fresh-eyes. Every problem here is intentional. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0d0b1f; color: #e9e6ff; }
  .shell { display: flex; min-height: 100vh; }
  .side { width: 220px; padding: 13px 11px; background: linear-gradient(180deg, #3b1d8f, #1e3a8a); }
  .logo { font-weight: 900; font-size: 22px; background: linear-gradient(90deg, #a855f7, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 23px; }
  .nav div { padding: 9px 7px; margin-bottom: 7px; cursor: pointer; border-radius: 999px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  .nav div.active { background: linear-gradient(90deg, #8b5cf6, #ec4899); box-shadow: 0 0 20px rgba(168, 85, 247, .7); }
  main { flex: 1; padding: 27px 31px; }
  h1 { font-size: 34px; font-weight: 900; margin: 0 0 6px; }
  .sub { color: #6b6690; font-size: 13px; margin-bottom: 21px; }
  .toolbar { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 18px; }
  .icon-btn { width: 22px; height: 22px; border: 0; background: none; color: #8f8ab5; padding: 0; cursor: pointer; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
  .card { background: rgba(255,255,255,.06); border: 1px solid #a855f7; border-radius: 22px; padding: 17px; box-shadow: 0 0 24px rgba(139, 92, 246, .45); }
  .card .n { font-size: 28px; font-weight: 800; }
  .card .d { color: #22c55e; font-size: 12px; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; background: #ec4899; font-size: 11px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .more { color: #7c7a99; font-size: 13px; text-decoration: none; }
  .fake-link { color: #60a5fa; text-decoration: underline; font-size: 13px; }
  .row { margin-top: 26px; display: flex; gap: 14px; align-items: center; transition: all .3s; }
  input { background: #1a1733; border: 1px solid #2d2a4a; color: #fff; padding: 9px; border-radius: 6px; }
  .go { background: #3a375a; color: #6f6b8f; border: 0; padding: 10px 14px; border-radius: 6px; }
  @media (max-width: 700px) { .side { display: none; } .cards { grid-template-columns: repeat(2, 1fr); } main { padding: 15px; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo">✨ Revenue AI</div>
    <nav class="nav">
      <div class="active">🏠 Dashboard</div>
      <div>📈 Reports</div>
      <div>💰 Payouts</div>
      <div>⚙️ Settings</div>
    </nav>
  </aside>
  <main>
    <div class="toolbar">
      <button class="icon-btn" aria-label="Export to CSV"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg></button>
      <button class="icon-btn" aria-label="Archive workspace"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="5"/><path d="M5 9v11h14V9"/></svg></button>
      <div class="icon-btn" onclick="alert('sync')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5"/></svg></div>
    </div>
    <h1>Welcome back, Jiwoo!! 👋</h1>
    <div class="sub">Supercharge your revenue with AI-powered insights.</div>
    <div class="cards">
      <div class="card"><div>REVENUE</div><div class="n">$48,210</div><div class="d">+12%!!</div></div>
      <div class="card"><div>PAYOUTS</div><div class="n">$124,860.40</div><div class="d">+3</div></div>
      <div class="card"><div>CUSTOMERS</div><div class="n">123,456</div><span class="badge">New ✨</span></div>
      <div class="card"><div>CHURN</div><div class="n">2.1%</div><a class="more" href="#">더보기</a></div>
    </div>
    <div class="row">
      <input placeholder="Search anything...">
      <button class="go" disabled>Apply</button>
      <span class="fake-link">View all payouts</span>
    </div>
  </main>
</div>
</body>
</html>
